<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Ножки сервера -->
  <rect x="12" y="52" width="8" height="2.5" rx="1" fill="#475569"/>
  <rect x="44" y="52" width="8" height="2.5" rx="1" fill="#475569"/>

  <!-- ВЕРХНИЙ ЮНИТ (Серверный блок 1) -->
  <rect x="6" y="12" width="52" height="18" rx="3.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Дисковые корзины (Hot-swap HDD) -->
  <rect x="11" y="16" width="7" height="10" rx="1" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <line x1="13" y1="21" x2="16" y2="21" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

  <rect x="20" y="16" width="7" height="10" rx="1" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <line x1="22" y1="21" x2="25" y2="21" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

  <rect x="29" y="16" width="7" height="10" rx="1" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <line x1="31" y1="21" x2="34" y2="21" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Вентиляционные прорези -->
  <line x1="39" y1="18" x2="39" y2="24" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="18" x2="42" y2="24" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Индикаторы (Питание и сеть) -->
  <circle cx="49" cy="18" r="1.6" fill="#3B82F6"/>
  <circle cx="49" cy="24" r="1.6" fill="#10B981"/>


  <!-- НИЖНИЙ ЮНИТ (Серверный блок 2) -->
  <rect x="6" y="34" width="52" height="18" rx="3.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Дисковые корзины -->
  <rect x="11" y="38" width="7" height="10" rx="1" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <line x1="13" y1="43" x2="16" y2="43" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

  <rect x="20" y="38" width="7" height="10" rx="1" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <line x1="22" y1="43" x2="25" y2="43" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

  <rect x="29" y="38" width="7" height="10" rx="1" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <line x1="31" y1="43" x2="34" y2="43" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Вентиляционные прорези -->
  <line x1="39" y1="40" x2="39" y2="46" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="40" x2="42" y2="46" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Индикаторы -->
  <circle cx="49" cy="40" r="1.6" fill="#3B82F6"/>
  <circle cx="49" cy="46" r="1.6" fill="#10B981"/>
</svg>