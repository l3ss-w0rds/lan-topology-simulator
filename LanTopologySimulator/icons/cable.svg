<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Плавный синий провод патч-корда -->
  <path d="M32 38 C32 46 16 46 16 53 C16 59 34 60 46 56" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Литой резиновый защитный колпачок (Boot) -->
  <path d="M23 27 H41 L37 39 H27 Z" fill="#3B82F6" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Ребра жесткости на колпачке -->
  <line x1="26" y1="31" x2="38" y2="31" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27.5" y1="35" x2="36.5" y2="35" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Прозрачный пластиковый корпус штекера RJ-45 -->
  <rect x="22" y="11" width="20" height="16" rx="2" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Цветные проводники витой пары внутри разъема (стандарт T568B) -->
  <line x1="26" y1="17" x2="26" y2="25" stroke="#F97316" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="30" y1="17" x2="30" y2="25" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="17" x2="34" y2="25" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="38" y1="17" x2="38" y2="25" stroke="#854D0E" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Носовая часть с контактами -->
  <rect x="25" y="5" width="14" height="6" rx="1" fill="#F1F5F9" stroke="#1E293B" stroke-width="2"/>

  <!-- Золотые контактные площадки (Pins) -->
  <line x1="28" y1="6" x2="28" y2="9.5" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="30.5" y1="6" x2="30.5" y2="9.5" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="33.5" y1="6" x2="33.5" y2="9.5" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="36" y1="6" x2="36" y2="9.5" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Защелка коннектора -->
  <path d="M32 20 V3 M28 3 H36" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>