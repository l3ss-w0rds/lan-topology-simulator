<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Ножки роутера -->
  <rect x="12" y="50" width="8" height="2.5" rx="1" fill="#475569"/>
  <rect x="44" y="50" width="8" height="2.5" rx="1" fill="#475569"/>

  <!-- Левая антенна с шарниром -->
  <rect x="13" y="27" width="4" height="3" rx="0.5" fill="#334155"/>
  <path d="M15 27 L10 8" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Правая антенна с шарниром -->
  <rect x="47" y="27" width="4" height="3" rx="0.5" fill="#334155"/>
  <path d="M49 27 L54 8" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Основной корпус -->
  <rect x="6" y="29" width="52" height="21" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Внутренняя панель индикаторов -->
  <rect x="9" y="32" width="46" height="15" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Индикатор питания (Power) -->
  <circle cx="15" cy="39.5" r="1.8" fill="#3B82F6"/>

  <!-- Индикатор интернета / WAN (Голубой) -->
  <circle cx="23" cy="39.5" r="1.8" fill="#06B6D4"/>

  <!-- Индикаторы локальной сети LAN 1, 2, 3 (Зеленые) -->
  <circle cx="31" cy="39.5" r="1.5" fill="#10B981"/>
  <circle cx="37" cy="39.5" r="1.5" fill="#10B981"/>
  <circle cx="43" cy="39.5" r="1.5" fill="#10B981"/>

  <!-- Кнопка WPS / сброса справа -->
  <rect x="48" y="37.5" width="4" height="4" rx="1" fill="#94A3B8"/>
</svg>